<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NavCook</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e03131">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── Bottom nav ─────────────────────────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 640px;
      display: flex;
      background: #141414;
      border-top: 1px solid #2a2a2a;
      z-index: 20;
    }

    .nav-tab {
      flex: 1;
      padding: 0.85rem 0.5rem 0.6rem;
      background: none;
      border: none;
      color: #666;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.15s;
    }

    .nav-tab i { font-size: 1.15rem; }
    .nav-tab.active { color: #e03131; }
    .nav-tab:hover:not(.active) { color: #ccc; }

    /* ── Panels ─────────────────────────────────────────────────────────────── */
    .panel {
      display: none;
      padding: 2rem 1.25rem 6rem;
    }

    .panel.active { display: block; }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    /* ── Import form ────────────────────────────────────────────────────────── */
    .import-row {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .import-row input[type="url"] {
      flex: 1;
      min-width: 0;
      padding: 0.7rem 1rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .import-row input[type="url"]::placeholder { color: #555; }
    .import-row input[type="url"]:focus { border-color: #e03131; }

    .import-row button {
      flex-shrink: 0;
      padding: 0.7rem 1.2rem;
      background: #e03131;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .import-row button:hover:not(:disabled) { background: #c92a2a; }
    .import-row button:disabled { background: #6b1010; cursor: not-allowed; }

    .import-status {
      margin-top: -1.75rem;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
      min-height: 1.1em;
    }

    .import-status.error { color: #f87171; }
    .import-status.success { color: #4ade80; }

    /* ── Section label ──────────────────────────────────────────────────────── */
    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #555;
      margin-bottom: 0.75rem;
    }

    /* ── Recipe list (explore) ──────────────────────────────────────────────── */
    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .recipe-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }

    .recipe-item:hover {
      border-color: #e03131;
      background: #1f1414;
    }

    .recipe-name {
      font-size: 0.95rem;
      font-weight: 500;
      color: #f0f0f0;
      flex: 1;
      min-width: 0;
    }

    .recipe-date {
      font-size: 0.78rem;
      color: #555;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Queue ──────────────────────────────────────────────────────────────── */
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      cursor: default;
      transition: border-color 0.15s, background 0.15s, opacity 0.15s;
    }

    .queue-item.drag-over {
      border-color: #e03131;
      background: #1f1111;
    }

    .queue-item.dragging {
      opacity: 0.4;
    }

    .drag-handle {
      color: #444;
      cursor: grab;
      font-size: 0.9rem;
      flex-shrink: 0;
      touch-action: none;
    }

    .drag-handle:active { cursor: grabbing; }

    .queue-item-name {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 500;
      color: #f0f0f0;
      min-width: 0;
      text-decoration: none;
      color: inherit;
    }

    .queue-item-name:hover { color: #e03131; }

    .queue-remove {
      background: none;
      border: none;
      color: #444;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.2rem 0.3rem;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .queue-remove:hover { color: #f87171; }

    /* ── History ────────────────────────────────────────────────────────────── */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }

    .history-item:hover {
      border-color: #e03131;
      background: #1f1414;
    }

    .history-name {
      font-size: 0.95rem;
      font-weight: 500;
      color: #f0f0f0;
      flex: 1;
      min-width: 0;
    }

    .history-date {
      font-size: 0.78rem;
      color: #555;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Shared ─────────────────────────────────────────────────────────────── */
    .empty {
      color: #444;
      font-size: 0.9rem;
      padding: 0.5rem 0;
    }

    .loading { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- ── Explore ──────────────────────────────────────────────────────────── -->
  <div class="panel active" id="panel-explore">
    <h1>NavCook</h1>

    <form id="importForm" class="import-row">
      <input
        type="url"
        id="urlInput"
        placeholder="Paste a recipe URL…"
        required
        autocomplete="off"
      >
      <button type="submit" id="submitBtn">Import</button>
    </form>

    <div class="import-status" id="importStatus"></div>

    <div class="section-label">Recipes</div>
    <div class="recipe-list" id="recipeList">
      <span class="loading">Loading…</span>
    </div>
  </div>

  <!-- ── Queue ────────────────────────────────────────────────────────────── -->
  <div class="panel" id="panel-queue">
    <h1>Queue</h1>
    <div class="section-label">Cook next</div>
    <div class="queue-list" id="queueList"></div>
  </div>

  <!-- ── History ──────────────────────────────────────────────────────────── -->
  <div class="panel" id="panel-history">
    <h1>History</h1>
    <div class="section-label">Completed recipes</div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- ── Bottom nav ───────────────────────────────────────────────────────── -->
  <nav class="bottom-nav">
    <button class="nav-tab active" id="nav-explore" onclick="showTab('explore')">
      <i class="fa-solid fa-compass"></i>
      Explore
    </button>
    <button class="nav-tab" id="nav-queue" onclick="showTab('queue')">
      <i class="fa-solid fa-list-check"></i>
      Queue
    </button>
    <button class="nav-tab" id="nav-history" onclick="showTab('history')">
      <i class="fa-solid fa-clock-rotate-left"></i>
      History
    </button>
  </nav>

  <script>
    // ── Tab switching ─────────────────────────────────────────────────────────
    const TABS = ['explore', 'queue', 'history'];

    function showTab(name) {
      TABS.forEach(t => {
        document.getElementById(`panel-${t}`).classList.toggle('active', t === name);
        document.getElementById(`nav-${t}`).classList.toggle('active', t === name);
      });
      if (name === 'queue') renderQueue();
      if (name === 'history') renderHistory();
    }

    // ── localStorage helpers ──────────────────────────────────────────────────
    function getQueue() {
      try { return JSON.parse(localStorage.getItem('navcook-queue') || '[]'); } catch { return []; }
    }

    function saveQueue(q) {
      localStorage.setItem('navcook-queue', JSON.stringify(q));
    }

    function getHistory() {
      try { return JSON.parse(localStorage.getItem('navcook-history') || '[]'); } catch { return []; }
    }

    // ── Queue rendering & drag-and-drop ───────────────────────────────────────
    let dragSrcIdx = null;

    function renderQueue() {
      const list = document.getElementById('queueList');
      const queue = getQueue();
      list.innerHTML = '';

      if (!queue.length) {
        list.innerHTML = '<span class="empty">Queue is empty — add recipes from their page.</span>';
        return;
      }

      queue.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'queue-item';
        row.draggable = true;
        row.innerHTML = `
          <i class="fa-solid fa-grip-lines drag-handle"></i>
          <a class="queue-item-name" href="/recipe.html?id=${encodeURIComponent(item.id)}">${item.name}</a>
          <button class="queue-remove" title="Remove from queue"><i class="fa-solid fa-xmark"></i></button>
        `;

        row.addEventListener('dragstart', () => {
          dragSrcIdx = idx;
          setTimeout(() => row.classList.add('dragging'), 0);
        });

        row.addEventListener('dragend', () => {
          row.classList.remove('dragging');
          dragSrcIdx = null;
          document.querySelectorAll('.queue-item').forEach(el => el.classList.remove('drag-over'));
        });

        row.addEventListener('dragover', e => {
          e.preventDefault();
          document.querySelectorAll('.queue-item').forEach(el => el.classList.remove('drag-over'));
          row.classList.add('drag-over');
        });

        row.addEventListener('drop', e => {
          e.preventDefault();
          if (dragSrcIdx === null || dragSrcIdx === idx) return;
          const q = getQueue();
          const [moved] = q.splice(dragSrcIdx, 1);
          q.splice(idx, 0, moved);
          saveQueue(q);
          renderQueue();
        });

        row.querySelector('.queue-remove').addEventListener('click', () => {
          const q = getQueue();
          q.splice(idx, 1);
          saveQueue(q);
          renderQueue();
        });

        list.appendChild(row);
      });
    }

    // ── History rendering ─────────────────────────────────────────────────────
    function formatDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      if (d.getFullYear() === 1970) return '';
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      const history = getHistory();
      list.innerHTML = '';

      if (!history.length) {
        list.innerHTML = '<span class="empty">No completed recipes yet.</span>';
        return;
      }

      history.forEach(item => {
        const a = document.createElement('a');
        a.className = 'history-item';
        a.href = `/recipe.html?id=${encodeURIComponent(item.id)}`;
        const date = formatDate(item.completedAt);
        a.innerHTML = `
          <span class="history-name">${item.name}</span>
          ${date ? `<span class="history-date">${date}</span>` : ''}
        `;
        list.appendChild(a);
      });
    }

    // ── Explore: recipe list ──────────────────────────────────────────────────
    async function loadRecipes() {
      const list = document.getElementById('recipeList');
      try {
        const res = await fetch('/api/recipes');
        const recipes = await res.json();
        list.innerHTML = '';
        if (!recipes.length) {
          list.innerHTML = '<span class="empty">No recipes yet — import one above.</span>';
          return;
        }
        for (const r of recipes) {
          const a = document.createElement('a');
          a.className = 'recipe-item';
          a.href = `/recipe.html?id=${encodeURIComponent(r.id)}`;
          const date = formatDate(r.dateAdded);
          a.innerHTML = `
            <span class="recipe-name">${r.name}</span>
            ${date ? `<span class="recipe-date">${date}</span>` : ''}
          `;
          list.appendChild(a);
        }
      } catch {
        list.innerHTML = '<span class="empty">Failed to load recipes.</span>';
      }
    }

    loadRecipes();

    // ── Import form ───────────────────────────────────────────────────────────
    const form = document.getElementById('importForm');
    const urlInput = document.getElementById('urlInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('importStatus');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();
      if (!url) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Importing…';
      statusEl.className = 'import-status';
      statusEl.textContent = '';

      try {
        const res = await fetch('/api/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          statusEl.className = 'import-status error';
          statusEl.textContent = data.error || 'Something went wrong.';
          return;
        }

        window.location.href = `/recipe.html?id=${encodeURIComponent(data.id)}`;

      } catch {
        statusEl.className = 'import-status error';
        statusEl.textContent = 'Network error — is the server running?';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Import';
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
