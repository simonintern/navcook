<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NavCook — Recipe</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e03131">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 1.5rem 1.25rem 1rem;
      border-bottom: 1px solid #1e1e1e;
      background: #0f0f0f;
      position: sticky;
      top: 0;
      z-index: 10;
      transition: background 0.4s;
    }

    .header-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .header-back-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .header-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #e03131;
      text-decoration: none;
    }

    .header-back:hover { color: #c92a2a; }

    .queue-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: none;
      border: 1px solid #333;
      border-radius: 20px;
      color: #888;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.375rem 0.875rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .queue-btn:hover { border-color: #e03131; color: #e03131; }
    .queue-btn.added { border-color: #4ade80; color: #4ade80; cursor: default; }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
      flex: 1;
    }

    .header .subtitle {
      color: #888;
      font-size: 0.82rem;
      margin-top: 0.3rem;
    }

    .imported-from {
      display: none;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.55rem;
      margin-bottom: 0.5rem;
      padding: 0.3rem 0.65rem;
      border: 1px solid #3b5bdb;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #748ffc;
      width: fit-content;
      max-width: 100%;
      overflow: hidden;
    }

    .imported-from.visible { display: flex; }

    .imported-from a {
      color: inherit;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .imported-from a:hover { text-decoration: underline; }

    /* Recipe-level timer (top-right of header) */
    .recipe-timer {
      display: none;
      align-items: center;
      gap: 0.4rem;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 0.35rem 0.7rem;
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      color: #ccc;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 0.1rem;
      transition: background 0.4s, border-color 0.4s, color 0.4s;
    }

    .recipe-timer.visible { display: flex; }
    .recipe-timer.done {
      background: #14532d;
      border-color: #16a34a;
      color: #4ade80;
    }

    /* Tab bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: #141414;
      border-top: 1px solid #2a2a2a;
      z-index: 20;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .tab {
      flex: 1;
      padding: 0.85rem 0.5rem 0.6rem;
      background: none;
      border: none;
      color: #666;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.15s;
    }

    .tab i { font-size: 1.1rem; }
    .tab.active { color: #e03131; }
    .tab:hover:not(.active) { color: #ccc; }

    /* Content panels */
    .content {
      flex: 1;
      padding: 1rem 1rem 5rem;
      overflow-y: auto;
    }

    .panel { display: none; }
    .panel.active { display: flex; flex-direction: column; gap: 0.75rem; }

    /* Cards */
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 1rem 1.1rem;
    }

    /* Ingredient card */
    .ingredient-card {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .ingredient-card.checked {
      background: #141414;
      border-color: #222;
    }

    .ingredient-card input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #444;
      border-radius: 4px;
      margin-top: 0.15rem;
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }

    .ingredient-card input[type="checkbox"]:checked {
      background: #e03131;
      border-color: #e03131;
    }

    .ingredient-card input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 0px;
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .ingredient-text {
      font-size: 0.95rem;
      line-height: 1.45;
      color: #e8e8e8;
      transition: color 0.15s;
      flex: 1;
    }

    .ingredient-card.checked .ingredient-text {
      color: #555;
    }

    .cart-add-btn {
      background: none;
      border: none;
      color: #444;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.15rem 0.25rem;
      flex-shrink: 0;
      transition: color 0.15s;
      align-self: center;
    }

    .cart-add-btn:hover { color: #e03131; }
    .cart-add-btn.in-cart { color: #e03131; }

    /* Step card */
    .step-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .step-number {
      font-size: 0.72rem;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .step-timer {
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: #555;
      display: none;
    }

    .step-card.active .step-number { color: #e03131; }
    .step-card.active .step-timer { color: #e03131; }
    .panel.cooking .step-timer { display: block; }

    .step-card.active {
      border-color: #e03131;
      background: #1f1111;
    }

    .step-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
    }

    .step-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #f0f0f0;
    }

    .step-text {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #bbb;
      overflow-wrap: break-word;
    }

    /* Raw JSON pill */
    .raw-json-pill {
      display: none;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.45rem;
      padding: 0.3rem 0.65rem;
      border: 1px solid #555;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #888;
      width: fit-content;
      max-width: 100%;
      overflow: hidden;
    }

    .raw-json-pill.visible { display: flex; }

    .raw-json-pill a {
      color: inherit;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .raw-json-pill a:hover { text-decoration: underline; }

    /* Error / loading */
    .message {
      padding: 3rem 1.5rem;
      text-align: center;
      color: #888;
      font-size: 0.95rem;
    }

    .message.error { color: #f87171; }

    /* Cook mode FAB */
    .fab-group {
      position: fixed;
      bottom: 5rem;
      right: 1.1rem;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.6rem;
      z-index: 30;
    }

    .fab {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #e03131;
      color: #fff;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(224,49,49,0.45);
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    .fab:hover { background: #c92a2a; transform: scale(1.06); }
    .fab:active { transform: scale(0.95); }

    .fab-back {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #2a2a2a;
      color: #ccc;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: background 0.15s, transform 0.1s;
    }

    .fab-back.visible { display: flex; }
    .fab-back:hover { background: #3a3a3a; transform: scale(1.06); }
    .fab-back:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div class="header" id="header" style="display:none">
    <div class="header-back-row">
      <a href="/" class="header-back"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <button class="queue-btn" id="queueBtn" title="Add to queue">
        <i class="fa-solid fa-circle-plus"></i> Add to queue
      </button>
    </div>
    <div class="header-top-row">
      <h1 style="flex:1"><span id="recipeTitle"></span><a id="editBtn" href="#" title="Edit recipe" style="display:none;color:#555;font-size:0.75em;padding:0.1em 0.25em;margin-left:0.35em;text-decoration:none;transition:color 0.15s;vertical-align:middle" onmouseover="this.style.color='#e03131'" onmouseout="this.style.color='#555'"><i class="fa-solid fa-pen-to-square"></i></a><button id="deleteBtn" title="Delete recipe" style="display:none;background:none;border:none;color:#555;font-size:0.75em;padding:0.1em 0.25em;margin-left:0.15em;cursor:pointer;transition:color 0.15s;vertical-align:middle" onmouseover="this.style.color='#e03131'" onmouseout="this.style.color='#555'"><i class="fa-solid fa-trash"></i></button></h1>
      <div class="recipe-timer" id="recipeTimer">
        <i class="fa-regular fa-clock"></i>
        <span id="recipeTimerDisplay">0:00</span>
      </div>
    </div>
    <p class="subtitle" id="recipeSubtitle"></p>
    <div class="imported-from" id="importedFrom">
      <i class="fa-solid fa-link"></i>
      <span>Imported from: </span><a id="importedFromLink" href="#" target="_blank" rel="noopener"></a>
    </div>
    <div class="raw-json-pill" id="rawLinkBar">
      <i class="fa-solid fa-code"></i>
      <span>Raw JSON: </span><a id="rawLink" href="#" target="_blank"></a>
    </div>
  </div>

  <div class="content">
    <div class="message" id="loadingMsg">Loading recipe…</div>

    <div class="panel active" id="panelIngredients"></div>
    <div class="panel" id="panelSteps"></div>
  </div>

  <nav class="tab-bar" id="tabBar" style="display:none">
    <button class="tab active" id="tabIngredients" onclick="switchTab('ingredients')">
      <i class="fa-solid fa-list"></i>
      Ingredients
    </button>
    <button class="tab" id="tabSteps" onclick="switchTab('steps')">
      <i class="fa-solid fa-shoe-prints"></i>
      Steps
    </button>
  </nav>

  <div class="fab-group" id="fabGroup" style="display:none">
    <button class="fab-back" id="fabBack" title="Previous step">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button class="fab" id="fabMain" title="Start cooking">
      <i class="fa-solid fa-play"></i>
    </button>
  </div>

  <script>
    // ── Cart localStorage helpers ─────────────────────────────────────────────
    function getCart() {
      try { return JSON.parse(localStorage.getItem('navcook-cart') || '[]'); } catch { return []; }
    }
    function saveCart(c) { localStorage.setItem('navcook-cart', JSON.stringify(c)); }

    // ── Queue / History localStorage helpers ──────────────────────────────────
    function getQueue() {
      try { return JSON.parse(localStorage.getItem('navcook-queue') || '[]'); } catch { return []; }
    }
    function saveQueue(q) { localStorage.setItem('navcook-queue', JSON.stringify(q)); }

    function addToHistory(id, name) {
      const history = (() => { try { return JSON.parse(localStorage.getItem('navcook-history') || '[]'); } catch { return []; } })();
      history.unshift({ id, name, completedAt: new Date().toISOString() });
      localStorage.setItem('navcook-history', JSON.stringify(history));
    }

    function removeFirstFromQueue(id) {
      const q = getQueue();
      const idx = q.findIndex(item => item.id === id);
      if (idx !== -1) q.splice(idx, 1);
      saveQueue(q);
    }

    // ── Tab switching ─────────────────────────────────────────────────────────
    function switchTab(tab) {
      document.getElementById('panelIngredients').classList.toggle('active', tab === 'ingredients');
      document.getElementById('panelSteps').classList.toggle('active', tab === 'steps');
      document.getElementById('tabIngredients').classList.toggle('active', tab === 'ingredients');
      document.getElementById('tabSteps').classList.toggle('active', tab === 'steps');
      if (tab === 'steps' && cookActive && stepCards[currentStep]) {
        requestAnimationFrame(() => stepCards[currentStep].scrollIntoView({ behavior: 'smooth', block: 'center' }));
      }
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function decodeHtml(str) {
      const txt = document.createElement('textarea');
      txt.innerHTML = str;
      return txt.value;
    }

    function getStepText(step) {
      if (typeof step === 'string') return step;
      if (step.text) return step.text;
      if (step.itemListElement) return step.itemListElement.map(getStepText).join(' ');
      return '';
    }

    function getStepName(step) {
      if (typeof step === 'string') return null;
      return step.name || null;
    }

    function formatSeconds(s) {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
      return `${m}:${String(sec).padStart(2,'0')}`;
    }

    // ── Wake Lock ─────────────────────────────────────────────────────────────
    let wakeLock = null;

    async function acquireWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch {}
    }

    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    // Re-acquire after tab becomes visible again (browser releases it on hide)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && cookActive) acquireWakeLock();
    });

    // ── Cook mode state ───────────────────────────────────────────────────────
    let recipeId = null;  // set once recipe loads
    let cookActive = false;
    let currentStep = 0;
    let stepCards = [];
    let stepTimerEls = [];
    let stepElapsed = [];   // seconds accumulated per step
    let recipeElapsed = 0;
    let recipeTimerInterval = null;
    let stepTimerInterval = null;

    function saveCookState() {
      if (!recipeId) return;
      sessionStorage.setItem(`navcook-cookstate-${recipeId}`, JSON.stringify({
        cookActive, currentStep, stepElapsed, recipeElapsed
      }));
    }

    function clearCookState() {
      if (recipeId) sessionStorage.removeItem(`navcook-cookstate-${recipeId}`);
    }

    function startRecipeTimer() {
      recipeTimerInterval = setInterval(() => {
        recipeElapsed++;
        document.getElementById('recipeTimerDisplay').textContent = formatSeconds(recipeElapsed);
        saveCookState();
      }, 1000);
    }

    function stopRecipeTimer() {
      if (recipeTimerInterval) {
        clearInterval(recipeTimerInterval);
        recipeTimerInterval = null;
      }
    }

    function startStepTimer(idx) {
      stepTimerInterval = setInterval(() => {
        stepElapsed[idx]++;
        if (stepTimerEls[idx]) stepTimerEls[idx].textContent = formatSeconds(stepElapsed[idx]);
        saveCookState();
      }, 1000);
    }

    function pauseStepTimer(idx) {
      if (stepTimerInterval) {
        clearInterval(stepTimerInterval);
        stepTimerInterval = null;
      }
    }

    function activateStep(idx) {
      // Deactivate previous
      if (cookActive && currentStep !== idx) {
        pauseStepTimer(currentStep);
        stepCards[currentStep].classList.remove('active');
      }
      currentStep = idx;
      stepCards[idx].classList.add('active');
      stepCards[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      startStepTimer(idx);
      saveCookState();
      updateFab();
    }

    function updateFab() {
      const fabMain = document.getElementById('fabMain');
      const fabBack = document.getElementById('fabBack');
      const isLast = currentStep === stepCards.length - 1;

      fabBack.classList.add('visible');
      if (currentStep === 0) {
        fabBack.innerHTML = '<i class="fa-solid fa-rotate-left"></i>';
        fabBack.title = 'Reset';
      } else {
        fabBack.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
        fabBack.title = 'Previous step';
      }

      fabMain.innerHTML = isLast
        ? '<i class="fa-solid fa-flag-checkered"></i>'
        : '<i class="fa-solid fa-chevron-right"></i>';
      fabMain.title = isLast ? 'Finish' : 'Next step';
    }

    function startCooking(stepCount) {
      cookActive = true;
      document.getElementById('panelSteps').classList.add('cooking');
      switchTab('steps');

      document.getElementById('recipeTimer').classList.add('visible');
      startRecipeTimer();

      activateStep(0);
      acquireWakeLock();
    }

    function nextStep(stepCount) {
      const isLast = currentStep === stepCount - 1;
      if (isLast) {
        finishCooking();
      } else {
        activateStep(currentStep + 1);
      }
    }

    function prevStep() {
      if (currentStep > 0) activateStep(currentStep - 1);
    }

    function resetCooking() {
      pauseStepTimer(currentStep);
      stopRecipeTimer();

      cookActive = false;
      releaseWakeLock();
      clearCookState();
      currentStep = 0;
      stepElapsed = stepElapsed.map(() => 0);
      recipeElapsed = 0;

      stepCards.forEach(c => c.classList.remove('active'));
      document.getElementById('panelSteps').classList.remove('cooking');
      stepTimerEls.forEach((el, i) => { if (el) el.textContent = '0:00'; });

      const timerEl = document.getElementById('recipeTimer');
      timerEl.classList.remove('visible', 'done');
      document.getElementById('recipeTimerDisplay').textContent = '0:00';

      const fabMain = document.getElementById('fabMain');
      fabMain.innerHTML = '<i class="fa-solid fa-play"></i>';
      fabMain.title = 'Start cooking';
      document.getElementById('fabBack').classList.remove('visible');
    }

    function finishCooking() {
      pauseStepTimer(currentStep);
      stopRecipeTimer();

      const timerEl = document.getElementById('recipeTimer');
      timerEl.classList.add('done');

      confetti({ particleCount: 120, spread: 70, origin: { x: 0.5, y: 0.6 } });

      // Record completion
      const recipeName = document.getElementById('recipeTitle').textContent;
      removeFirstFromQueue(recipeId);
      addToHistory(recipeId, recipeName);

      cookActive = false;
      releaseWakeLock();
      clearCookState();
      currentStep = 0;
      stepElapsed = stepElapsed.map(() => 0);
      recipeElapsed = 0;

      stepCards.forEach(c => c.classList.remove('active'));
      document.getElementById('panelSteps').classList.remove('cooking');
      stepTimerEls.forEach((el, i) => { if (el) el.textContent = '0:00'; });

      timerEl.classList.remove('visible', 'done');
      document.getElementById('recipeTimerDisplay').textContent = '0:00';

      const fabMain = document.getElementById('fabMain');
      fabMain.innerHTML = '<i class="fa-solid fa-play"></i>';
      fabMain.title = 'Start cooking';
      document.getElementById('fabBack').classList.remove('visible');
    }

    // ── Load recipe ───────────────────────────────────────────────────────────
    async function loadRecipe() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      recipeId = id;
      if (!id) {
        document.getElementById('loadingMsg').className = 'message error';
        document.getElementById('loadingMsg').textContent = 'No recipe specified.';
        return;
      }

      let recipe;
      try {
        const res = await fetch(`/api/recipe/${encodeURIComponent(id)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const doc = await res.json();
        recipe = doc.recipe;
        window._recipeDoc = doc;
      } catch (err) {
        document.getElementById('loadingMsg').className = 'message error';
        document.getElementById('loadingMsg').textContent = `Failed to load recipe: ${err.message}`;
        return;
      }

      document.getElementById('loadingMsg').style.display = 'none';

      const title = decodeHtml(recipe.name || 'Recipe');
      document.title = `${title} — NavCook`;

      const ingredients = recipe.recipeIngredient || [];
      const rawSteps = Array.isArray(recipe.recipeInstructions) ? recipe.recipeInstructions : [];
      const steps = rawSteps.flatMap(s =>
        s['@type'] === 'HowToSection' ? (s.itemListElement || []) : [s]
      ).filter(s => getStepText(s).trim());

      document.getElementById('recipeTitle').textContent = title;  // targets the <span>

      function parseDurationMins(iso) {
        if (!iso) return null;
        const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
        if (!m) return null;
        const mins = parseInt(m[1] || 0) * 60 + parseInt(m[2] || 0);
        return mins > 0 ? mins : null;
      }

      function fmtDuration(mins) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        if (!h) return `${m}m`;
        return `${h}:${String(m).padStart(2, '0')}`;
      }

      const prep = parseDurationMins(recipe.prepTime);
      const cook = parseDurationMins(recipe.cookTime);
      const total = parseDurationMins(recipe.totalTime);

      let timePart = '';
      if (prep && cook) timePart = `${fmtDuration(prep)} prep · ${fmtDuration(cook)} cook${total ? ` · ${fmtDuration(total)} total` : ''}`;
      else if (total) timePart = `${fmtDuration(total)} total`;
      else if (prep) timePart = `${fmtDuration(prep)} prep`;
      else if (cook) timePart = `${fmtDuration(cook)} cook`;

      const countPart = `${ingredients.length} ingredient${ingredients.length !== 1 ? 's' : ''} · ${steps.length} step${steps.length !== 1 ? 's' : ''}`;
      document.getElementById('recipeSubtitle').textContent = timePart ? `${timePart} · ${countPart}` : countPart;

      if (recipe.sourceUrl) {
        const link = document.getElementById('importedFromLink');
        link.href = recipe.sourceUrl;
        try {
          link.textContent = new URL(recipe.sourceUrl).hostname.replace(/^www\./, '');
        } catch {
          link.textContent = recipe.sourceUrl;
        }
        link.title = recipe.sourceUrl;
        document.getElementById('importedFrom').classList.add('visible');
      }

      const apiUrl = `/api/recipe/${encodeURIComponent(id)}`;
      document.getElementById('rawLink').href = apiUrl;
      document.getElementById('rawLink').textContent = apiUrl;

      // Ingredients
      const storageKey = `navcook-checked-${id}`;
      const checked = new Set(JSON.parse(sessionStorage.getItem(storageKey) || '[]'));

      function saveChecked() {
        sessionStorage.setItem(storageKey, JSON.stringify([...checked]));
      }

      const piPanel = document.getElementById('panelIngredients');

      function reorderIngredients() {
        const cards = [...piPanel.querySelectorAll('.ingredient-card')];
        const unchecked = cards.filter(c => !c.classList.contains('checked'));
        const checkedCards = cards.filter(c => c.classList.contains('checked'));
        [...unchecked, ...checkedCards].forEach(c => piPanel.appendChild(c));
      }

      ingredients.forEach((ing, i) => {
        const ingText = decodeHtml(ing);
        const card = document.createElement('label');
        card.className = 'card ingredient-card' + (checked.has(i) ? ' checked' : '');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = checked.has(i);
        cb.addEventListener('change', () => {
          if (cb.checked) checked.add(i); else checked.delete(i);
          card.classList.toggle('checked', cb.checked);
          saveChecked();
          reorderIngredients();
        });
        const span = document.createElement('span');
        span.className = 'ingredient-text';
        span.textContent = ingText;

        const cartBtn = document.createElement('button');
        cartBtn.className = 'cart-add-btn';
        cartBtn.type = 'button';
        cartBtn.title = 'Add to shopping cart';
        const cart = getCart();
        if (cart.some(c => c.text === ingText)) cartBtn.classList.add('in-cart');
        cartBtn.innerHTML = '<i class="fa-solid fa-cart-plus"></i>';
        cartBtn.addEventListener('click', e => {
          e.preventDefault();
          const c = getCart();
          if (!c.some(item => item.text === ingText)) {
            c.push({ text: ingText, addedAt: new Date().toISOString() });
            saveCart(c);
          }
          cartBtn.classList.add('in-cart');
        });

        card.appendChild(cb);
        card.appendChild(span);
        card.appendChild(cartBtn);
        piPanel.appendChild(card);
      });

      reorderIngredients();

      // Steps
      stepElapsed = steps.map(() => 0);
      const psPanel = document.getElementById('panelSteps');

      steps.forEach((step, i) => {
        const card = document.createElement('div');
        card.className = 'card step-card';
        const name = getStepName(step);
        const text = decodeHtml(getStepText(step));

        const timerEl = document.createElement('span');
        timerEl.className = 'step-timer';
        timerEl.textContent = '0:00';

        card.innerHTML = `
          <div class="step-meta">
            <span class="step-number">Step ${i + 1} of ${steps.length}</span>
          </div>
          ${name ? `<div class="step-header"><span class="step-name">${decodeHtml(name)}</span></div>` : ''}
          <p class="step-text">${text}</p>
        `;
        card.querySelector('.step-meta').appendChild(timerEl);

        stepCards.push(card);
        stepTimerEls.push(timerEl);
        psPanel.appendChild(card);
      });

      // FAB wiring
      document.getElementById('fabMain').addEventListener('click', () => {
        if (!cookActive) {
          startCooking(steps.length);
        } else {
          nextStep(steps.length);
        }
      });

      document.getElementById('fabBack').addEventListener('click', () => {
        if (currentStep === 0) resetCooking(); else prevStep();
      });

      // Queue button
      const queueBtn = document.getElementById('queueBtn');
      const recipeName = title;

      queueBtn.addEventListener('click', () => {
        const q = getQueue();
        q.push({ id: recipeId, name: recipeName, addedAt: new Date().toISOString() });
        saveQueue(q);
        queueBtn.classList.add('added');
        queueBtn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Added';
        queueBtn.disabled = true;
      });

      const editBtn = document.getElementById('editBtn');
      const deleteBtn = document.getElementById('deleteBtn');
      editBtn.href = `/create.html?id=${encodeURIComponent(id)}`;

      const me = await fetch('/api/auth/me').then(r => r.json()).catch(() => null);
      if (me && me.userId && me.userId === window._recipeDoc.ownerId) {
        editBtn.style.display = '';
        deleteBtn.style.display = '';
        deleteBtn.addEventListener('click', async () => {
          if (!confirm(`Delete "${window._recipeDoc.recipe?.name}"? This cannot be undone.`)) return;
          const res = await fetch(`/api/recipe/${encodeURIComponent(id)}`, { method: 'DELETE' });
          if (res.ok) window.location.href = '/';
          else alert('Failed to delete recipe.');
        });
      }

      document.getElementById('header').style.display = '';
      document.getElementById('rawLinkBar').classList.add('visible');
      document.getElementById('tabBar').style.display = '';
      document.getElementById('fabGroup').style.display = 'flex';

      // Restore in-progress cook session
      const saved = (() => { try { return JSON.parse(sessionStorage.getItem(`navcook-cookstate-${id}`) || 'null'); } catch { return null; } })();
      if (saved && saved.cookActive) {
        cookActive = true;
        document.getElementById('panelSteps').classList.add('cooking');
        currentStep = saved.currentStep || 0;
        stepElapsed = saved.stepElapsed && saved.stepElapsed.length === steps.length ? saved.stepElapsed : stepElapsed;
        recipeElapsed = saved.recipeElapsed || 0;

        document.getElementById('recipeTimer').classList.add('visible');
        document.getElementById('recipeTimerDisplay').textContent = formatSeconds(recipeElapsed);
        startRecipeTimer();

        stepTimerEls.forEach((el, i) => { if (el) el.textContent = formatSeconds(stepElapsed[i]); });
        stepCards[currentStep].classList.add('active');
        startStepTimer(currentStep);
        updateFab();
        switchTab('steps');
        acquireWakeLock();
      }
    }

    loadRecipe();
  </script>
  <script src="/auth-dialog.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
      });
    }
  </script>
</body>
</html>
